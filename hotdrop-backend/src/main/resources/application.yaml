

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr([req:%X{requestId:-SYS}]){yellow} %clr(%-40.40logger{39}){cyan} : %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] [req:%X{requestId:-SYS}] %-40.40logger{39} : %m%n"
  file:
    name: logs/hotdrop-app.log
  logback:
    rollingpolicy:
      file-name-pattern: "logs/hotdrop-app-%d{yyyy-MM-dd}.%i.log.gz"
      max-history: 30
      max-file-size: 10MB
      total-size-cap: 1GB
spring:
  application:
    name: hotdrop-backend

  data:
    redis:
      url: ${REDIS_URL}

  cache:
    type: redis
    redis:
      enable-statistics: true
      time-to-live: ${REDIS_EXPIRY_TIME}
      cache-null-values: false
  servlet:
    multipart:
      max-file-size: ${ONE_IMAGE_SIZE}
      max-request-size: ${TOTAL_IMAGE_SIZE}
  datasource:
    url: ${POSTGRES_SQL_URI}
    username: ${POSTGRES_SQL_USER}
    password: ${POSTGRES_SQL_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  flyway:
    repair-on-migrate: true
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - email
              - profile
              - openid
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id-placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-placeholder}
            scope:
              - read:user
              - user:email
  mail:
    host: "${SMTP_HOST}"
    port: "${SMTP_PORT}"
    username: "${SMTP_USER}"
    password: "${SMTP_PASS}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    email-verification-expiration-ms: ${EMAIL_TOKEN_EXPIRY}
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION}
    jwt-expiration-ms: ${JWT_EXPIRY}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}