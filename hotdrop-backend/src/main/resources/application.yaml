spring:
  application:
    name: hotdrop-backend

  datasource:
    url: ${POSTGRES_SQL_URI}
    username: postgres
    password: ${POSTGRES_SQL_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: false