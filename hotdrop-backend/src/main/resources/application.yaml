spring:
  application:
    name: hotdrop-backend

  datasource:
    url: ${POSTGRES_SQL_URI}
    username: postgres
    password: ${POSTGRES_SQL_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true

  mail:
    host: "${SMTP_HOST}"
    port: "${SMTP_PORT}"
    username: "${SMTP_USER}"
    password: "${SMTP_PASS}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    email-verification-expiration-ms: ${EMAIL_TOKEN_EXPIRY}
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION}
    jwt-expiration-ms: ${JWT_EXPIRY}
